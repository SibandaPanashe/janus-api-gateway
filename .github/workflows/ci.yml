name: Janus CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: janus
          POSTGRES_USER: janus
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests --batch-mode
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/janus
          SPRING_DATASOURCE_USERNAME: janus
          SPRING_DATASOURCE_PASSWORD: test-password
          SPRING_DATA_REDIS_HOST: localhost
          JANUS_JWT_SECRET: test-secret-for-ci-pipeline-only

      - name: Run tests
        run: mvn test --batch-mode
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/janus
          SPRING_DATASOURCE_USERNAME: janus
          SPRING_DATASOURCE_PASSWORD: test-password
          SPRING_DATA_REDIS_HOST: localhost
          JANUS_JWT_SECRET: test-secret-for-ci-pipeline-only

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sibandapanashe/janus-api-gateway/janus-core:latest
            ghcr.io/sibandapanashe/janus-api-gateway/janus-core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max