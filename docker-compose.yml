services:
  redis:
    image: redis:7-alpine
    container_name: janus-redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - janus-net

  postgres:
    image: postgres:16-alpine
    container_name: janus-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-janus}
      POSTGRES_USER: ${POSTGRES_USER:-janus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-janus-dev-password}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-janus} -d ${POSTGRES_DB:-janus}"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - janus-net

  janus-core:
    build: .
    container_name: janus-core
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/janus
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-janus}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-janus-dev-password}
      JANUS_JWT_SECRET: ${JANUS_JWT_SECRET:-janus-dev-secret-change-in-production-min-256-bits}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - janus-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    container_name: janus-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/cache:/var/cache/nginx/janus_cache
    depends_on:
      janus-core:
        condition: service_healthy
    networks:
      - janus-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
  postgres-data:

networks:
  janus-net:
    driver: bridge