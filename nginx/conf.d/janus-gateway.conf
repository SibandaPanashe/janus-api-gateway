# ============================================================
# Janus Intelligent API Gateway - Nginx Edge Configuration
# Three-layer defense: Connection -> Rate -> Micro-cache
# ============================================================

# Layer 1: Connection Limiting (per IP)
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_conn_status 429;

# Layer 2: Static Rate Limiting (per IP, fast path before Java)
limit_req_zone $binary_remote_addr zone=rate_per_ip:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=burst_per_ip:10m rate=10r/s;
limit_req_status 429;

# Layer 3: Micro-cache for public GET endpoints
proxy_cache_path /var/cache/nginx/janus_cache
    levels=1:2
    keys_zone=janus_cache:10m
    max_size=100m
    inactive=10s
    use_temp_path=off;

# Upstream to Janus Core Engine (Spring Boot)
upstream janus_backend {
    least_conn;
    server janus-core:8080 weight=1 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTPS Server
server {
    listen 443 ssl;
    http2 on;
    server_name api.janus.local;

    # TLS Configuration
    ssl_certificate     /etc/nginx/ssl/janus.crt;
    ssl_certificate_key /etc/nginx/ssl/janus.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Connection cap: 20 concurrent connections per IP
    limit_conn conn_per_ip 20;

    # ---- Main API Proxy (all requests hit this) ----
    location / {
        # Apply static burst rate limiting
        limit_req zone=rate_per_ip burst=30 nodelay;
        limit_req zone=burst_per_ip burst=50 nodelay;

        proxy_pass http://janus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Backend failure handling (load shedding)
        proxy_next_upstream error timeout http_500 http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 5s;
    }

    # ---- Public Endpoints with Micro-Caching ----
    location /api/v1/public/ {
        limit_req zone=rate_per_ip burst=50 nodelay;

        proxy_pass http://janus_backend;
        proxy_cache janus_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 5s;
        proxy_cache_bypass $http_cache_control;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_cache_methods GET;
    }

    # ---- Health Check (no rate limiting) ----
    location /api/health {
        proxy_pass http://janus_backend;
        proxy_set_header Host localhost;
    }

    # ---- Actuator (internal only, IP restricted) ----
    location /actuator/ {
        allow 127.0.0.1;
        allow 172.0.0.0/8;    # Docker network
        allow 192.168.0.0/16;  # Local network
        deny all;

        proxy_pass http://janus_backend;
    }

    # ---- WebSocket for real-time dashboard ----
    location /ws/ {
        proxy_pass http://janus_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 86400s;
    }

    # ---- Custom error pages ----
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"rate_limit_exceeded","message":"Too many requests. Nginx edge limit reached.","retry_after":"1"}';
    }

    error_page 502 503 504 = @backend_down;
    location @backend_down {
        default_type application/json;
        return 503 '{"error":"service_unavailable","message":"Janus engine is temporarily unavailable. Retrying..."}';
    }
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name api.janus.local;
    return 301 https://$host$request_uri;
}