server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    relaxed-host-validation: true
    remote-ip-header: X-Forwarded-For
    protocol-header: X-Forwarded-Proto

spring:
  application:
    name: janus-gateway

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:janus}
    username: ${POSTGRES_USER:janus}
    password: ${POSTGRES_PASSWORD:janus-dev-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 10000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  pro-price-id: ${STRIPE_PRO_PRICE_ID:price_placeholder}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:always}
      probes:
        enabled: true

janus:
  rules:
    directory: src/main/resources/rules
  jwt:
    secret: ${JANUS_JWT_SECRET:janus-dev-secret-change-in-production-min-256-bits}
    access-token-ttl: ${JANUS_JWT_ACCESS_TTL:3600000}
    refresh-token-ttl: ${JANUS_JWT_REFRESH_TTL:2592000000}
  admin:
    username: ${ADMIN_USERNAME:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
    jwt-secret: ${ADMIN_JWT_SECRET:}
    jwt-ttl-minutes: ${ADMIN_JWT_TTL_MINUTES:30}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    com.sibanda: ${LOG_LEVEL:INFO}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html