server:
  port: 8080
  tomcat:
    relaxed-host-validation: true

spring:
  application:
    name: janus-gateway

  # Redis
  data:
    redis:
      host: localhost
      port: 6380
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5433/janus
    username: janus
    password: janus-dev-password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 10000

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# Custom Janus config
janus:
  rules:
    directory: src/main/resources/rules

  jwt:
    secret: ${JANUS_JWT_SECRET:janus-dev-secret-change-in-production-min-256-bits}
    access-token-ttl: 3600000     # 1 hour in ms
    refresh-token-ttl: 2592000000 # 30 days in ms